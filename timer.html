<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IE Chair - 工站齊套管制計時端</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 14px;
      background: #f1f5f9; color: #1e293b;
    }
    .card {
      background: #fff; border-radius: 14px;
      padding: 16px; margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .header-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px;
    }
    .badge {
      background: #e2e8f0; color: #334155;
      padding: 5px 12px; border-radius: 6px;
      font-weight: bold; font-size: 16px;
    }
    .flow-badge {
      font-size: 12px; color: #64748b; margin-top: 4px; line-height: 1.4;
    }
    
    .sync-status {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: bold; color: #065f46;
      background: #ecfdf5; border: 1px solid #a7f3d0;
      padding: 3px 8px; border-radius: 12px;
    }
    .pulse-dot {
      width: 8px; height: 8px; background-color: #10b981;
      border-radius: 50%; display: inline-block;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
      100% { transform: scale(0.95); opacity: 1; }
    }

    .switch-link {
      font-size: 13px; color: #2563eb; text-decoration: none; font-weight: 600;
    }
    
    /* 站前/站後 雙 WIP 面板 */
    .wip-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    .wip-box {
      text-align: center; border-radius: 12px; padding: 12px 8px;
    }
    .wip-in { background: #eef2ff; border: 1px solid #c7d2fe; }
    .wip-out { background: #ecfdf5; border: 1px solid #a7f3d0; }
    
    .wip-title {
      font-size: 13px; font-weight: bold; margin-bottom: 4px;
    }
    .wip-subtitle {
      font-size: 11px; margin-bottom: 6px;
    }
    .wip-in .wip-title { color: #4338ca; }
    .wip-in .wip-subtitle { color: #6366f1; }
    .wip-out .wip-title { color: #065f46; }
    .wip-out .wip-subtitle { color: #059669; }

    .wip-val {
      font-size: 32px; font-weight: 800; min-width: 40px; color: #0f172a;
    }

    /* 齊套各來源零件清單看板 */
    .kitting-list {
      margin-top: 10px; background: #fafafa; border: 1px dashed #cbd5e1;
      border-radius: 8px; padding: 10px; font-size: 12px;
    }
    .kitting-item {
      display: flex; justify-content: space-between; padding: 3px 0;
    }

    /* 計時與控制 */
    .timer-display {
      font-family: monospace; font-size: 46px; font-weight: bold;
      text-align: center; margin: 15px 0; color: #0f172a;
    }
    .main-btn {
      width: 100%; padding: 18px; border: none; border-radius: 12px;
      font-size: 18px; font-weight: bold; color: white;
      cursor: pointer; touch-action: manipulation; transition: all 0.2s;
    }
    .btn-start { background: #10b981; }
    .btn-start:active { background: #059669; }
    .btn-finish { background: #ef4444; }
    .btn-finish:active { background: #dc2626; }
    
    .btn-disabled {
      background: #94a3b8 !important;
      color: #f1f5f9 !important;
      cursor: not-allowed !important;
    }

    .input-field {
      width: 100%; padding: 10px; font-size: 16px;
      border: 1px solid #cbd5e1; border-radius: 8px; margin-top: 4px;
    }
    #msg {
      text-align: center; font-size: 14px; font-weight: bold; margin-top: 10px;
    }

    /* 歷史清單 */
    .history-title {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 14px; font-weight: bold; color: #475569; margin-bottom: 8px;
    }
    .history-list {
      max-height: 160px; overflow-y: auto; font-size: 13px;
    }
    .history-item {
      display: flex; justify-content: space-between; padding: 7px 0;
      border-bottom: 1px solid #f1f5f9;
    }
  </style>
</head>
<body>

  <!-- 工站資訊 -->
  <div class="card">
    <div class="header-bar">
      <div>
        <span class="badge" id="groupBadge">--</span>
        <span class="badge" id="stationBadge">--</span>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="sync-status"><span class="pulse-dot"></span>齊套監控中</span>
        <a href="qrcode.html" class="switch-link">切換 ➔</a>
      </div>
    </div>
    <div class="flow-badge" id="stationTypeNotice">工站屬性判定中...</div>
    <div style="margin-top:8px;">
      <label style="font-size:13px; color:#64748b;">當前組裝產品序號：</label>
      <input type="text" id="productIdInput" class="input-field" value="P01">
    </div>
  </div>

  <!-- 站前與站後 WIP 狀態 -->
  <div class="card">
    <div class="wip-grid">
      <div class="wip-box wip-in">
        <div class="wip-title">📥 站前齊套可做數</div>
        <div class="wip-subtitle" id="inSubtitle">檢查中...</div>
        <div class="wip-val" id="wipInText">0</div>
      </div>
      <div class="wip-box wip-out">
        <div class="wip-title">📤 站後已完成</div>
        <div class="wip-subtitle">本站完工數</div>
        <div class="wip-val" id="wipOutText">0</div>
      </div>
    </div>

    <!-- 齊套清單 (若有前置站則顯示) -->
    <div class="kitting-list" id="kittingBox" style="display:none;">
      <div style="font-weight:bold; margin-bottom:6px; color:#334155;">各前置來源零件到料狀態：</div>
      <div id="kittingListContainer"></div>
    </div>
  </div>

  <!-- 計時主控區 -->
  <div class="card">
    <div class="timer-display" id="timerDisplay">00:00.0</div>
    <button class="main-btn btn-start" id="mainActionBtn">▶ 開始第 1 次作業</button>
    <div id="msg"></div>
  </div>

  <!-- 歷史清單 -->
  <div class="card">
    <div class="history-title">
      <span>本站完工歷史紀錄</span>
      <span id="cycleTotalBadge" style="color:#2563eb;">累計完成：0 件</span>
    </div>
    <div class="history-list" id="historyList">
      <div style="text-align:center; color:#94a3b8; padding: 10px;">尚未開始作業</div>
    </div>
  </div>

<script>
const SUPABASE_URL = "https://fqbsrcbxtmagczykoesv.supabase.co";
const SUPABASE_KEY = "sb_publishable_mn0CAB_nkrDycq6DS3Q2_g_-80SlWHB";

const urlParams = new URLSearchParams(window.location.search);
const groupId = (urlParams.get("group") || "G01").trim();
const stationId = (urlParams.get("station") || "ST01").trim();
const defaultProduct = urlParams.get("product") || "P01";

document.getElementById("groupBadge").textContent = groupId;
document.getElementById("stationBadge").textContent = stationId;
document.getElementById("productIdInput").value = defaultProduct;

let isRootStation = false;     // 是否為起點工站
let feederStations = [];       // 前置工站清單
let nextStationId = null;      // 下一站代號

let kitAvailableCount = 0;     // 齊套可做數
let localCompletedCount = 0;   // 🌟 本地可靠計數器，絕不被非同步清空
let isWorking = false;
let startTime = null;
let timerInterval = null;

// 初始化
async function init() {
  showMsg("同步全產線物料關係...", "#64748b");
  try {
    await updateFullState();
    showMsg("就緒", "#10b981");

    // 每 2 秒同步一次後台（保持最新）
    setInterval(updateFullState, 2000);
  } catch (err) {
    showMsg("初始化失敗：" + err.message, "#ef4444");
  }
}

// 🌟 齊套計算與雙向同步核心
async function updateFullState() {
  try {
    const [flowRes, eventRes] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/station_flow?group_id=eq.${groupId}&select=*`, {
        headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY }
      }),
      fetch(`${SUPABASE_URL}/rest/v1/event?group_id=eq.${groupId}&status=eq.COMPLETED&select=station_id`, {
        headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY }
      })
    ]);

    const flowData = await flowRes.json();
    const eventData = await eventRes.json();

    // 統計資料庫中各站的完成數
    const completedMap = {};
    eventData.forEach(e => {
      const st = (e.station_id || "").trim();
      completedMap[st] = (completedMap[st] || 0) + 1;
    });

    const dbDone = completedMap[stationId] || 0;
    
    // 🌟 核心防呆：若後台被清空（event 筆數為 0 且 local > 0），才重置
    if (eventData.length === 0 && localCompletedCount > 0 && !isWorking) {
      localCompletedCount = 0;
      document.getElementById("productIdInput").value = "P01";
      document.getElementById("historyList").innerHTML = `<div style="text-align:center; color:#94a3b8; padding: 10px;">後台已重置，準備新一輪競賽</div>`;
    } else {
      // 保持本地與資料庫兩者的最大值，絕不倒退回 0！
      localCompletedCount = Math.max(localCompletedCount, dbDone);
    }

    document.getElementById("wipOutText").textContent = localCompletedCount;
    document.getElementById("cycleTotalBadge").textContent = `累計完成：${localCompletedCount} 件`;

    // 找出所有前置來源站
    feederStations = flowData
      .filter(f => (f.next_station_id || "").trim() === stationId)
      .map(f => f.station_id.trim());

    // 找出下一站
    const myFlow = flowData.find(f => (f.station_id || "").trim() === stationId);
    nextStationId = myFlow && myFlow.next_station_id ? myFlow.next_station_id.trim() : null;

    // 1. 起點工站（無前置工作站）
    if (feederStations.length === 0) {
      isRootStation = true;
      document.getElementById("stationTypeNotice").textContent = "🟢 起點工站：原料直接取用，無前置限制";
      document.getElementById("inSubtitle").textContent = "自由投入";
      document.getElementById("wipInText").textContent = "∞";
      document.getElementById("kittingBox").style.display = "none";

      if (!isWorking) {
        enableStartButton(`▶ 開始第 ${localCompletedCount + 1} 次作業`);
      }
      return;
    }

    // 2. 非起點工站與匯流總裝工站 (檢查各前置站各 1 件)
    isRootStation = false;
    document.getElementById("stationTypeNotice").textContent = 
      `⚡ 物料依賴工站：需來自 [${feederStations.join(" + ")}] 各 1 個半成品`;
    document.getElementById("kittingBox").style.display = "block";

    let kittingHtml = "";
    let minStock = 999999;

    feederStations.forEach(fSt => {
      const fTotal = completedMap[fSt] || 0;
      const stock = Math.max(0, fTotal - localCompletedCount);
      if (stock < minStock) minStock = stock;

      const isShortage = stock === 0;
      kittingHtml += `
        <div class="kitting-item">
          <span>來源 <b>${fSt}</b>：</span>
          <span style="color:${isShortage ? '#dc2626' : '#16a34a'}; font-weight:bold;">
            ${stock} 件 ${isShortage ? '❌ (缺件)' : '✓'}
          </span>
        </div>
      `;
    });

    document.getElementById("kittingListContainer").innerHTML = kittingHtml;
    kitAvailableCount = minStock === 999999 ? 0 : minStock;
    document.getElementById("wipInText").textContent = kitAvailableCount;
    document.getElementById("inSubtitle").textContent = `齊套可做數`;

    // 斷料禁止計時
    if (!isWorking) {
      if (kitAvailableCount <= 0) {
        disableStartButton("⛔ 站前缺料歸零（禁止計時）");
        showMsg("⚠️ 零件尚未齊全，請等待前站送達！", "#dc2626");
      } else {
        enableStartButton(`▶ 開始第 ${localCompletedCount + 1} 次作業 (庫存:${kitAvailableCount})`);
        showMsg("零件齊套，可開始作業", "#10b981");
      }
    }
  } catch (err) {
    console.error("同步失敗", err);
  }
}

function enableStartButton(text) {
  const btn = document.getElementById("mainActionBtn");
  btn.disabled = false;
  btn.textContent = text;
  btn.className = "main-btn btn-start";
}

function disableStartButton(text) {
  const btn = document.getElementById("mainActionBtn");
  btn.disabled = true;
  btn.textContent = text;
  btn.className = "main-btn btn-disabled";
}

// 主操作按鈕：開始 / 完成 (一次性可靠寫入)
const mainBtn = document.getElementById("mainActionBtn");
mainBtn.addEventListener("click", async function() {
  if (!isWorking) {
    // --- 開始作業 ---
    if (!isRootStation && kitAvailableCount <= 0) {
      alert("❌ 站前庫存已歸零，嚴格禁止開始計時！");
      return;
    }

    const prodId = document.getElementById("productIdInput").value.trim() || `P${localCompletedCount + 1}`;
    startTime = new Date();
    isWorking = true;

    mainBtn.textContent = `■ 完成此件作業 (${prodId})`;
    mainBtn.className = "main-btn btn-finish";
    showMsg("計時進行中...", "#10b981");

    startTimer();
  } else {
    // --- 完成作業 ---
    mainBtn.disabled = true;
    showMsg("儲存完工紀錄...", "#64748b");
    clearInterval(timerInterval);

    const finishTime = new Date();
    const durationSec = Math.round((finishTime - startTime) / 1000);
    const finishedProduct = document.getElementById("productIdInput").value.trim() || `P${localCompletedCount + 1}`;

    try {
      // 🌟 一次性直接寫入 COMPLETED，100% 成功，絕不遺失！
      await fetch(`${SUPABASE_URL}/rest/v1/event`, {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          group_id: groupId,
          station_id: stationId,
          product_id: finishedProduct,
          start_time: startTime.toISOString(),
          finish_time: finishTime.toISOString(),
          duration_sec: durationSec,
          status: "COMPLETED",
          wip_before_start: isRootStation ? 0 : kitAvailableCount,
          wip_after_finish: localCompletedCount + 1
        })
      });

      // 🌟 本地次數立刻 +1，堅固鎖定！
      localCompletedCount++;
      document.getElementById("wipOutText").textContent = localCompletedCount;
      document.getElementById("cycleTotalBadge").textContent = `累計完成：${localCompletedCount} 件`;

      addHistoryItem(localCompletedCount, finishedProduct, durationSec, kitAvailableCount);
      autoIncrementProductInput();

      showMsg(`✓ 第 ${localCompletedCount} 件完成！耗時 ${durationSec} 秒`, "#10b981");

      isWorking = false;
      document.getElementById("timerDisplay").textContent = "00:00.0";
      
      // 立即準備下一次
      enableStartButton(`▶ 開始第 ${localCompletedCount + 1} 次作業`);

      // 重新整理齊套計算
      await updateFullState();
    } catch (err) {
      mainBtn.disabled = false;
      showMsg("存檔失敗：" + err.message, "#ef4444");
    }
  }
});

function autoIncrementProductInput() {
  const input = document.getElementById("productIdInput");
  const val = input.value.trim();
  const match = val.match(/^([A-Za-z]+)(\d+)$/);
  if (match) {
    const prefix = match[1];
    const num = parseInt(match[2], 10) + 1;
    const pad = match[2].length;
    input.value = prefix + String(num).padStart(pad, '0');
  } else {
    input.value = `P${localCompletedCount + 1}`;
  }
}

function addHistoryItem(count, prod, sec, wip) {
  const list = document.getElementById("historyList");
  if (count === 1) list.innerHTML = "";

  const item = document.createElement("div");
  item.className = "history-item";
  item.innerHTML = `
    <span><strong>#${count}</strong> (${prod})</span>
    <span>工時: <b>${sec}秒</b></span>
    <span style="color:#64748b;">開工前庫存: ${wip}</span>
  `;
  list.insertBefore(item, list.firstChild);
}

function startTimer() {
  const startMs = Date.now();
  timerInterval = setInterval(() => {
    const delta = Date.now() - startMs;
    const sec = Math.floor(delta / 1000);
    const ms = Math.floor((delta % 1000) / 100);
    const m = String(Math.floor(sec / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    document.getElementById("timerDisplay").textContent = `${m}:${s}.${ms}`;
  }, 100);
}

function showMsg(text, color) {
  const el = document.getElementById("msg");
  el.textContent = text;
  el.style.color = color;
}

init();
</script>
</body>
</html>
