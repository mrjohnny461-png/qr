<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IE Chair - 工站即時同步計時端</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 14px;
      background: #f1f5f9; color: #1e293b;
    }
    .card {
      background: #fff; border-radius: 14px;
      padding: 16px; margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .header-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px;
    }
    .badge {
      background: #e2e8f0; color: #334155;
      padding: 5px 12px; border-radius: 6px;
      font-weight: bold; font-size: 16px;
    }
    .flow-badge {
      font-size: 12px; color: #64748b; margin-top: 4px;
    }
    
    /* 即時連線狀態燈 */
    .sync-status {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: bold; color: #065f46;
      background: #ecfdf5; border: 1px solid #a7f3d0;
      padding: 3px 8px; border-radius: 12px;
    }
    .pulse-dot {
      width: 8px; height: 8px; background-color: #10b981;
      border-radius: 50%; display: inline-block;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
      100% { transform: scale(0.95); opacity: 1; }
    }

    .switch-link {
      font-size: 13px; color: #2563eb; text-decoration: none; font-weight: 600;
    }
    
    /* 站前/站後 雙 WIP 面板 */
    .wip-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    .wip-box {
      text-align: center; border-radius: 12px; padding: 12px 8px;
    }
    .wip-in { background: #eef2ff; border: 1px solid #c7d2fe; }
    .wip-out { background: #ecfdf5; border: 1px solid #a7f3d0; }
    
    .wip-title {
      font-size: 13px; font-weight: bold; margin-bottom: 6px;
    }
    .wip-in .wip-title { color: #4338ca; }
    .wip-out .wip-title { color: #065f46; }

    .wip-counter {
      display: flex; justify-content: center; align-items: center; gap: 10px;
    }
    .wip-btn {
      width: 40px; height: 40px; border-radius: 50%;
      border: none; font-size: 22px; font-weight: bold;
      color: white; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      touch-action: manipulation;
    }
    .wip-btn:active { transform: scale(0.92); }
    .btn-in { background: #4f46e5; }
    .btn-out { background: #059669; }

    .wip-val {
      font-size: 32px; font-weight: 800; min-width: 40px; color: #0f172a;
    }

    /* 計時與控制 */
    .timer-display {
      font-family: monospace; font-size: 46px; font-weight: bold;
      text-align: center; margin: 15px 0; color: #0f172a;
    }
    .main-btn {
      width: 100%; padding: 18px; border: none; border-radius: 12px;
      font-size: 20px; font-weight: bold; color: white;
      cursor: pointer; touch-action: manipulation;
    }
    .btn-start { background: #10b981; }
    .btn-start:active { background: #059669; }
    .btn-finish { background: #ef4444; }
    .btn-finish:active { background: #dc2626; }
    .input-field {
      width: 100%; padding: 10px; font-size: 16px;
      border: 1px solid #cbd5e1; border-radius: 8px; margin-top: 4px;
    }
    #msg {
      text-align: center; font-size: 14px; font-weight: bold; margin-top: 10px;
    }

    /* 歷史清單 */
    .history-title {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 14px; font-weight: bold; color: #475569; margin-bottom: 8px;
    }
    .history-list {
      max-height: 180px; overflow-y: auto; font-size: 13px;
    }
    .history-item {
      display: flex; justify-content: space-between; padding: 7px 0;
      border-bottom: 1px solid #f1f5f9;
    }
  </style>
</head>
<body>

  <!-- 工站資訊 -->
  <div class="card">
    <div class="header-bar">
      <div>
        <span class="badge" id="groupBadge">--</span>
        <span class="badge" id="stationBadge">--</span>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="sync-status"><span class="pulse-dot"></span>即時同步中</span>
        <a href="qrcode.html" class="switch-link">切換 ➔</a>
      </div>
    </div>
    <div class="flow-badge" id="nextStationNotice">物料接續站：載入中...</div>
    <div style="margin-top:8px;">
      <label style="font-size:13px; color:#64748b;">當前組裝產品序號：</label>
      <input type="text" id="productIdInput" class="input-field" value="P01">
    </div>
  </div>

  <!-- 站前與站後 雙 WIP 調整器 -->
  <div class="card">
    <div class="wip-grid">
      <!-- 站前 WIP (待本站加工) -->
      <div class="wip-box wip-in">
        <div class="wip-title">📥 站前待加工</div>
        <div class="wip-counter">
          <button class="wip-btn btn-in" id="btnMinusIn">-</button>
          <span class="wip-val" id="wipInText">0</span>
          <button class="wip-btn btn-in" id="btnPlusIn">+</button>
        </div>
      </div>
      <!-- 站後 WIP (本站完工待移交) -->
      <div class="wip-box wip-out">
        <div class="wip-title">📤 站後已完成</div>
        <div class="wip-counter">
          <button class="wip-btn btn-out" id="btnMinusOut">-</button>
          <span class="wip-val" id="wipOutText">0</span>
          <button class="wip-btn btn-out" id="btnPlusOut">+</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 計時主控區 -->
  <div class="card">
    <div class="timer-display" id="timerDisplay">00:00.0</div>
    <button class="main-btn btn-start" id="mainActionBtn">▶ 開始第 1 次作業</button>
    <div id="msg"></div>
  </div>

  <!-- 歷史清單 -->
  <div class="card">
    <div class="history-title">
      <span>本站完工歷史紀錄</span>
      <span id="cycleTotalBadge" style="color:#2563eb;">累計完成：0 件</span>
    </div>
    <div class="history-list" id="historyList">
      <div style="text-align:center; color:#94a3b8; padding: 10px;">尚未開始作業</div>
    </div>
  </div>

<script>
const SUPABASE_URL = "https://fqbsrcbxtmagczykoesv.supabase.co";
const SUPABASE_KEY = "sb_publishable_mn0CAB_nkrDycq6DS3Q2_g_-80SlWHB";

const urlParams = new URLSearchParams(window.location.search);
const groupId = urlParams.get("group") || "G01";
const stationId = urlParams.get("station") || "ST01";
const defaultProduct = urlParams.get("product") || "P01";

document.getElementById("groupBadge").textContent = groupId;
document.getElementById("stationBadge").textContent = stationId;
document.getElementById("productIdInput").value = defaultProduct;

let nextStationId = null;
let currentInWip = 0;
let currentOutWip = 0;
let wipRecordId = null;
let isWorking = false;
let startTime = null;
let timerInterval = null;
let currentEventId = null;
let wipBeforeStart = 0;
let completedCount = 0;

// 初始化
async function init() {
  showMsg("連線同步中...", "#64748b");
  try {
    const flowRes = await fetch(
      `${SUPABASE_URL}/rest/v1/station_flow?group_id=eq.${groupId}&station_id=eq.${stationId}&select=*`,
      { headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY } }
    );
    const flowData = await flowRes.json();
    if (flowData.length > 0 && flowData[0].next_station_id) {
      nextStationId = flowData[0].next_station_id;
      document.getElementById("nextStationNotice").textContent = `➔ 物料接續下一站：${nextStationId}`;
    } else {
      nextStationId = null;
      document.getElementById("nextStationNotice").textContent = `➔ 產線最終站（無後續工站）`;
    }

    await fetchWip();
    showMsg("就緒，隨時可開始作業", "#10b981");

    // 🌟 每 2 秒全自動雙向同步（前站推料即時跳數字、大螢幕清空即時歸零）
    setInterval(autoSyncLive, 2000);
  } catch (err) {
    showMsg("初始化失敗：" + err.message, "#ef4444");
  }
}

// 讀取/建立 WIP 庫存
async function fetchWip() {
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/station_wip?group_id=eq.${groupId}&station_id=eq.${stationId}&select=*`,
    { headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY } }
  );
  const data = await res.json();
  if (data.length > 0) {
    wipRecordId = data[0].id;
    currentInWip = data[0].input_wip || 0;
    currentOutWip = data[0].output_wip || 0;
  } else {
    const insertRes = await fetch(`${SUPABASE_URL}/rest/v1/station_wip`, {
      method: "POST",
      headers: {
        apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json", Prefer: "return=representation"
      },
      body: JSON.stringify({ group_id: groupId, station_id: stationId, input_wip: 0, output_wip: 0 })
    });
    const created = await insertRes.json();
    wipRecordId = created[0].id;
    currentInWip = 0;
    currentOutWip = 0;
  }
  document.getElementById("wipInText").textContent = currentInWip;
  document.getElementById("wipOutText").textContent = currentOutWip;
}

// 🌟 全自動雙向同步核心（偵測大螢幕歸零與前站送料）
async function autoSyncLive() {
  if (!wipRecordId) return;

  try {
    // 1. 同步最新 WIP 庫存數字
    const wipRes = await fetch(
      `${SUPABASE_URL}/rest/v1/station_wip?id=eq.${wipRecordId}&select=input_wip,output_wip`,
      { headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY } }
    );
    const wipData = await wipRes.json();
    if (wipData.length > 0) {
      currentInWip = wipData[0].input_wip || 0;
      currentOutWip = wipData[0].output_wip || 0;
      document.getElementById("wipInText").textContent = currentInWip;
      document.getElementById("wipOutText").textContent = currentOutWip;
    }

    // 2. 檢查大螢幕是否按下了「清空紀錄」
    if (!isWorking && completedCount > 0) {
      const eventRes = await fetch(
        `${SUPABASE_URL}/rest/v1/event?group_id=eq.${groupId}&station_id=eq.${stationId}&select=id`,
        { headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY } }
      );
      const evList = await eventRes.json();
      // 如果本站原本有完工紀錄，但資料庫裡已經被清空成 0 筆了
      if (evList.length === 0) {
        completedCount = 0;
        document.getElementById("cycleTotalBadge").textContent = "累計完成：0 件";
        document.getElementById("historyList").innerHTML = `<div style="text-align:center; color:#94a3b8; padding: 10px;">後台已重置，準備新一輪競賽</div>`;
        document.getElementById("productIdInput").value = "P01";
        mainBtn.textContent = "▶ 開始第 1 次作業";
        mainBtn.className = "main-btn btn-start";
        document.getElementById("timerDisplay").textContent = "00:00.0";
        showMsg("✓ 後台已清空歸零，可重新開始！", "#10b981");
      }
    }
  } catch(e) {}
}

// 手動調整 WIP
async function updateWipDb(newIn, newOut) {
  if (newIn < 0) newIn = 0;
  if (newOut < 0) newOut = 0;
  currentInWip = newIn;
  currentOutWip = newOut;
  document.getElementById("wipInText").textContent = currentInWip;
  document.getElementById("wipOutText").textContent = currentOutWip;

  await fetch(`${SUPABASE_URL}/rest/v1/station_wip?id=eq.${wipRecordId}`, {
    method: "PATCH",
    headers: {
      apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      input_wip: currentInWip,
      output_wip: currentOutWip,
      updated_at: new Date().toISOString()
    })
  });
}

document.getElementById("btnPlusIn").onclick = () => updateWipDb(currentInWip + 1, currentOutWip);
document.getElementById("btnMinusIn").onclick = () => updateWipDb(currentInWip - 1, currentOutWip);
document.getElementById("btnPlusOut").onclick = () => updateWipDb(currentInWip, currentOutWip + 1);
document.getElementById("btnMinusOut").onclick = () => updateWipDb(currentInWip, currentOutWip - 1);

// 主操作按鈕：開始 (站前-1) / 完成 (站後+1 並推送下一站站前+1)
const mainBtn = document.getElementById("mainActionBtn");
mainBtn.addEventListener("click", async function() {
  if (!isWorking) {
    // --- 開始作業 ---
    const prodId = document.getElementById("productIdInput").value.trim() || `P${completedCount + 1}`;
    wipBeforeStart = currentInWip;

    mainBtn.disabled = true;
    showMsg("開工扣料中...", "#64748b");

    try {
      if (currentInWip > 0) {
        await updateWipDb(currentInWip - 1, currentOutWip);
      }

      startTime = new Date();
      const eventRes = await fetch(`${SUPABASE_URL}/rest/v1/event`, {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json", Prefer: "return=representation"
        },
        body: JSON.stringify({
          group_id: groupId,
          station_id: stationId,
          product_id: prodId,
          start_time: startTime.toISOString(),
          status: "IN_PROGRESS",
          wip_before_start: wipBeforeStart
        })
      });
      const created = await eventRes.json();
      currentEventId = created[0].id;

      isWorking = true;
      mainBtn.disabled = false;
      mainBtn.textContent = `■ 完成此件作業 (${prodId})`;
      mainBtn.className = "main-btn btn-finish";
      showMsg("計時進行中...", "#10b981");

      startTimer();
    } catch (err) {
      mainBtn.disabled = false;
      showMsg("啟動失敗：" + err.message, "#ef4444");
    }
  } else {
    // --- 完成作業 ---
    mainBtn.disabled = true;
    showMsg("完工推送至下一站...", "#64748b");
    clearInterval(timerInterval);

    const finishTime = new Date();
    const durationSec = Math.round((finishTime - startTime) / 1000);
    const finishedProduct = document.getElementById("productIdInput").value.trim();

    try {
      await updateWipDb(currentInWip, currentOutWip + 1);

      if (nextStationId) {
        await pushWipToNextStation(nextStationId);
      }

      await fetch(`${SUPABASE_URL}/rest/v1/event?id=eq.${currentEventId}`, {
        method: "PATCH",
        headers: {
          apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          finish_time: finishTime.toISOString(),
          duration_sec: durationSec,
          status: "COMPLETED",
          wip_after_finish: currentOutWip
        })
      });

      completedCount++;
      addHistoryItem(completedCount, finishedProduct, durationSec, wipBeforeStart);
      document.getElementById("cycleTotalBadge").textContent = `累計完成：${completedCount} 件`;

      autoIncrementProductInput();

      showMsg(`✓ 第 ${completedCount} 件完成！已推送至下一站`, "#10b981");

      isWorking = false;
      mainBtn.disabled = false;
      mainBtn.textContent = `▶ 開始第 ${completedCount + 1} 次作業`;
      mainBtn.className = "main-btn btn-start";
      document.getElementById("timerDisplay").textContent = "00:00.0";
    } catch (err) {
      mainBtn.disabled = false;
      showMsg("完成失敗：" + err.message, "#ef4444");
    }
  }
});

async function pushWipToNextStation(nextSt) {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/station_wip?group_id=eq.${groupId}&station_id=eq.${nextSt}&select=*`,
      { headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY } }
    );
    const data = await res.json();
    if (data.length > 0) {
      const targetId = data[0].id;
      const targetInputWip = (data[0].input_wip || 0) + 1;
      await fetch(`${SUPABASE_URL}/rest/v1/station_wip?id=eq.${targetId}`, {
        method: "PATCH",
        headers: {
          apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ input_wip: targetInputWip, updated_at: new Date().toISOString() })
      });
    }
  } catch(e) {
    console.error("推送失敗", e);
  }
}

function autoIncrementProductInput() {
  const input = document.getElementById("productIdInput");
  const val = input.value.trim();
  const match = val.match(/^([A-Za-z]+)(\d+)$/);
  if (match) {
    const prefix = match[1];
    const num = parseInt(match[2], 10) + 1;
    const pad = match[2].length;
    input.value = prefix + String(num).padStart(pad, '0');
  } else {
    input.value = `P${completedCount + 1}`;
  }
}

function addHistoryItem(count, prod, sec, wip) {
  const list = document.getElementById("historyList");
  if (count === 1) list.innerHTML = "";

  const item = document.createElement("div");
  item.className = "history-item";
  item.innerHTML = `
    <span><strong>#${count}</strong> (${prod})</span>
    <span>工時: <b>${sec}秒</b></span>
    <span style="color:#64748b;">開工前WIP: ${wip}</span>
  `;
  list.insertBefore(item, list.firstChild);
}

function startTimer() {
  const startMs = Date.now();
  timerInterval = setInterval(() => {
    const delta = Date.now() - startMs;
    const sec = Math.floor(delta / 1000);
    const ms = Math.floor((delta % 1000) / 100);
    const m = String(Math.floor(sec / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    document.getElementById("timerDisplay").textContent = `${m}:${s}.${ms}`;
  }, 100);
}

function showMsg(text, color) {
  const el = document.getElementById("msg");
  el.textContent = text;
  el.style.color = color;
}

init();
</script>
</body>
</html>
